# Reader document OCR MCP server.
# Start:  docker compose up -d --build        (armory reaches it at http://ocr:29402/mcp)
# Needs a .env next to this file with INTERNAL_API_TOKEN (same value as Citadel's); see .env.example.
# The model runs in OCR_SGLang_Model (AI/ModelServices/OCR_SGLang_Model); save its address and token as a connection on the admin page.

name: ocr

services:
  ocr:
    build: .
    restart: unless-stopped
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
      READER_ADMIN_PASSWORD: ${READER_ADMIN_PASSWORD:-}
      READER_MAX_PAGES: ${READER_MAX_PAGES:-30}
      READER_TIMEOUT_S: ${READER_TIMEOUT_S:-110}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${READER_BIND:-0.0.0.0}:${READER_PORT:-29402}:29402"
    volumes:
      - ocr_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:29402/health')"]
      interval: 15s
      timeout: 5s
      start_period: 30s
    networks: [citadel]

volumes:
  ocr_data:

networks:
  # Join the Citadel stack's network so armory/ember_api can reach http://ocr:29402. Start the Citadel stack first:
  # it creates this network.
  citadel:
    name: citadel_core
    external: true
