[project]
name = "reader"
version = "0.1.0"
description = "Document OCR MCP server for Citadel and Ember (Baidu Unlimited OCR 2 through SGLangModel)"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.28.0",
    "pydantic==2.13.4",
    "uvicorn==0.49.0",
    "python-dotenv==1.2.2",
    "httpx>=0.27",  # talks to SGLangModel
    "pymupdf==1.27.2.2",  # draws PDF pages, the version Baidu's README uses
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pillow>=11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
